<script type="module">
  import { MODELS } from './models/index.js';
  import { createSpriteRenderer } from './renderer.js';

  const renderer = createSpriteRenderer();
  window.spriteNames = Object.keys(MODELS);
  window.renderSprite = (name, size) => renderer.render(MODELS[name], size);
  window.spritesReady = true;
